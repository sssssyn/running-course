<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ランコース生成</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;height:100%;font:16px/1.4 system-ui,sans-serif}
  body{display:flex;flex-direction:column}
  #ui{padding:10px;background:#222;color:#eee;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  #ui input,#ui select,#ui button{font:inherit;padding:8px;border-radius:6px;border:0}
  #km{width:5em}
  #go{background:#e63946;color:#fff;font-weight:bold}
  #go:disabled{opacity:.5}
  #rec{background:#2a9d8f;color:#fff;font-weight:bold}
  #vo{background:#555;color:#fff}
  #vo.off{opacity:.45;text-decoration:line-through}
  #rec.on{background:#1e88e5}
  #stats{flex-basis:100%;font-size:22px;font-weight:bold;font-variant-numeric:tabular-nums}
  #status{flex-basis:100%;font-size:14px;color:#bbb}
  #map{flex:1}
</style>
</head>
<body>
<div id="ui">
  <input id="km" type="number" value="5" min="0.5" max="42" step="0.5" inputmode="decimal"> km
  <select id="shape"><option value="loop">ループ</option><option value="back">往復</option></select>
  <select id="mode"><option value="coarse">大まかな道</option><option value="fine">細かい道</option></select>
  <button id="go">コース生成</button>
  <button id="rec">スタート</button>
  <button id="vo" title="音声ナビ">🔊</button>
  <div id="stats"></div>
  <div id="status">現在地を取得中…</div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const OSRM = 'https://routing.openstreetmap.de/';
// 大まか: 自転車プロファイル。路地や階段を避け、通り抜けやすい道を選ぶので曲がりが減る
// 細かい: 徒歩プロファイル。歩道・公園・遊歩道まで使うが、その分こまめに曲がる
const MODE = {coarse:{path:'routed-bike/route/v1/bike/', n:3}, fine:{path:'routed-foot/route/v1/foot/', n:5}};
const $ = id => document.getElementById(id);
const say = t => $('status').textContent = t;

const map = L.map('map').setView([35.681,139.767], 14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);

let start = null, startMarker = null, meMarker = null, routeLayer = null;

function setStart(ll){
  start = ll;
  if(startMarker) startMarker.setLatLng(ll); else startMarker = L.marker(ll).addTo(map);
}
map.on('click', e => { setStart(e.latlng); say('スタート地点を設定しました'); });

if(navigator.geolocation){
  navigator.geolocation.watchPosition(p => {
    const ll = L.latLng(p.coords.latitude, p.coords.longitude);
    if(meMarker) meMarker.setLatLng(ll);
    else meMarker = L.circleMarker(ll,{radius:7,color:'#fff',weight:2,fillColor:'#1e88e5',fillOpacity:1}).addTo(map);
    if(!start){ setStart(ll); map.setView(ll,15); say('現在地を取得しました。距離を決めて生成してください'); }
    if(rec) addPoint(ll, p.coords.accuracy);
    if(nav) navCheck(ll);
  }, err => {
    const why = {1:'ブラウザ/OSで位置情報が拒否されています', 2:'測位できません(OSの位置情報サービスがオフの可能性)', 3:'測位がタイムアウトしました'}[err.code] || err.message;
    if(!start) say('現在地NG: '+why+'。地図をタップしてスタート地点を指定してください');
  },
     {enableHighAccuracy:true, timeout:10000, maximumAge:5000});
} else say('地図をタップしてスタート地点を指定してください');

// --- 球面座標 ---
const R = 6371, rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
function dest(lat, lon, brg, d){
  const f1=rad(lat), l1=rad(lon), t=rad(brg), s=d/R;
  const f2 = Math.asin(Math.sin(f1)*Math.cos(s) + Math.cos(f1)*Math.sin(s)*Math.cos(t));
  const l2 = l1 + Math.atan2(Math.sin(t)*Math.sin(s)*Math.cos(f1), Math.cos(s)-Math.sin(f1)*Math.sin(f2));
  return [deg(f2), ((deg(l2)+540)%360)-180];
}
function dist(a, b){
  const df=rad(b[0]-a[0]), dl=rad(b[1]-a[1]);
  const h = Math.sin(df/2)**2 + Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

// 目標距離ぶんの経由点。scale は直線距離と実際の道のりのズレを吸収する係数
function waypoints(shape, target, scale, seed){
  const lat = start.lat, lon = start.lng, here = [lat, lon];
  if(shape === 'back') return [here, dest(lat, lon, seed.dir, target/2*scale), here];
  const r = target/(2*Math.PI)*scale;                 // 円周 = 目標距離 になる半径
  const [clat, clon] = dest(lat, lon, seed.dir, r);   // スタートを通る円の中心
  const pts = [here], n = seed.n;
  for(let i=1; i<n; i++) pts.push(dest(clat, clon, seed.dir+180 + seed.spin*360*i/n, r));
  pts.push(here);
  return pts;
}

async function route(pts, path){
  const url = OSRM + path + pts.map(p => p[1]+','+p[0]).join(';')
            + '?overview=full&geometries=geojson&steps=true&continue_straight=false';
  const res = await fetch(url);
  if(!res.ok) throw new Error('経路サーバ応答 '+res.status);
  const j = await res.json();
  if(j.code !== 'Ok' || !j.routes || !j.routes.length) throw new Error(j.message || '経路が見つかりません');
  return j.routes[0];
}

async function generate(){
  if(!start){ say('スタート地点がありません。地図をタップしてください'); return; }
  const target = parseFloat($('km').value), shape = $('shape').value;
  if(!(target > 0)){ say('距離を入力してください'); return; }
  const m = MODE[$('mode').value];
  const seed = {dir: Math.random()*360, spin: Math.random()<0.5 ? 1 : -1, n: m.n};
  let scale = shape === 'back' ? 0.8 : 1.0, best = null;
  $('go').disabled = true;
  try{
    for(let i=0; i<4; i++){                      // 距離が合うまで縮尺を補正して再探索
      say('生成中… ('+(i+1)+'/4)');
      const r = await route(waypoints(shape, target, scale, seed), m.path);
      const km = r.distance/1000;
      if(!best || Math.abs(km-target) < Math.abs(best.km-target)) best = {km, route:r};
      if(Math.abs(km-target)/target < 0.08) break;
      scale *= target/km;
    }
    if(routeLayer) routeLayer.remove();
    routeLayer = L.geoJSON(best.route.geometry, {style:{color:'#e63946',weight:5,opacity:.8}}).addTo(map);
    buildNav(best.route);
    map.fitBounds(routeLayer.getBounds(), {padding:[30,30]});
    say(best.km.toFixed(2)+' km のコースができました(目標 '+target+' km)');
  }catch(e){
    say('生成に失敗: '+e.message);
  }finally{
    $('go').disabled = false;
  }
}
$('go').onclick = () => { speak('コースを作ります'); generate(); };

// --- 音声ナビ ---
const TURN = {'left':'左', 'sharp left':'左', 'slight left':'左',
              'right':'右', 'sharp right':'右', 'slight right':'右',
              'straight':'まっすぐ', 'uturn':'Uターン'};
let nav = null, voice = true;

function speak(t){
  if(!voice || !window.speechSynthesis) return;
  speechSynthesis.cancel();              // 前の読み上げが残ると指示が遅れて流れる
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'ja-JP'; u.rate = 1.1;
  speechSynthesis.speak(u);
}

function buildNav(route){
  const steps = [], end = route.legs.length - 1;
  route.legs.forEach((leg, li) => {
    for(const st of leg.steps){
      const m = st.maneuver, pt = [m.location[1], m.location[0]];
      let text = null;
      if(m.type === 'arrive') text = li === end ? 'ゴールです' : null;  // 経由点の通過はゴールではない
      else if(m.type !== 'depart' && TURN[m.modifier] && (m.modifier !== 'straight' || m.type === 'fork'))
        text = TURN[m.modifier]+'です';
      if(!text) continue;
      const prev = steps[steps.length-1];
      // 曲がり角が連続する区間で予告まで流すと喋りっぱなしになる
      steps.push({pt, text, quiet: !!prev && dist(prev.pt, pt) < 0.15});
    }
  });
  nav = steps.length ? {steps, i:0, pre:false} : null;
}

function navCheck(ll){
  const here = [ll.lat, ll.lng], s = nav.steps[nav.i], next = nav.steps[nav.i+1];
  const km = dist(here, s.pt);
  if(km*1000 < 25 || (next && dist(here, next.pt) < km)){   // 通過したら次の指示へ
    speak(s.text);
    if(++nav.i >= nav.steps.length) nav = null;
    else nav.pre = false;
  } else if(km*1000 < 120 && !nav.pre && !s.quiet){
    speak('この先'+Math.round(km*100)*10+'メートル、'+s.text);
    nav.pre = true;
  }
}

$('vo').onclick = () => {
  voice = !voice;
  $('vo').classList.toggle('off', !voice);
  if(voice) speak('音声ナビ オン');else speechSynthesis.cancel();
};

// --- 走行記録 ---
let rec = null, trackLine = null, tick = null, wake = null;
const KEY = 'run-track';
const clock = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');

function stats(){
  if(!rec) return;
  const sec = (Date.now()-rec.t0)/1000;
  $('stats').textContent = rec.km.toFixed(2)+' km   '+clock(sec)
    + (rec.km > 0.05 ? '   '+clock(sec/rec.km)+'/km' : '');
}

function addPoint(ll, acc){
  if(acc > 30) return;                        // 精度が悪い測位は距離を狂わせるので捨てる
  const p = [ll.lat, ll.lng], last = rec.pts[rec.pts.length-1];
  if(last){
    const d = dist(last, p);
    if(d < 0.005) return;                     // 5m未満は静止中のGPSゆらぎとみなす
    rec.km += d;
  }
  rec.pts.push(p);
  trackLine.setLatLngs(rec.pts);
  localStorage.setItem(KEY, JSON.stringify(rec));   // 途中でリロードされても失わない
  stats();
}

// ponytail: 無音ループ再生でページを「メディア再生中」に見せ、停止されにくくする。
//           Androidでは延命するがiOSでは保証されない。確実にやるならネイティブアプリ化。
function silentWav(sec){
  const rate = 8000, n = rate*sec, buf = new Uint8Array(44+n), dv = new DataView(buf.buffer);
  const w = (o,t) => { for(let i=0;i<t.length;i++) buf[o+i] = t.charCodeAt(i); };
  w(0,'RIFF'); dv.setUint32(4, 36+n, true); w(8,'WAVEfmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,rate,true); dv.setUint32(28,rate,true); dv.setUint16(32,1,true); dv.setUint16(34,8,true);
  w(36,'data'); dv.setUint32(40,n,true); buf.fill(128,44);        // 8bit無音は128
  let b = ''; for(const c of buf) b += String.fromCharCode(c);
  return 'data:audio/wav;base64,' + btoa(b);
}
let keep = null;

async function startRec(resume){
  rec = resume || {pts:[], km:0, t0:Date.now()};
  if(trackLine) trackLine.remove();
  trackLine = L.polyline(rec.pts, {color:'#1e88e5', weight:6, opacity:.9}).addTo(map);
  $('rec').textContent = 'ゴール';
  $('rec').classList.add('on');
  tick = setInterval(stats, 1000);
  if(!keep){ keep = new Audio(silentWav(1)); keep.loop = true; }
  keep.play().catch(()=>{});
  try{ wake = await navigator.wakeLock.request('screen'); }catch(e){}  // 画面が消えると測位が止まるため
  stats();
}

function stopRec(){
  clearInterval(tick); tick = null;
  if(keep) keep.pause();
  if(wake){ wake.release(); wake = null; }
  const sec = (Date.now()-rec.t0)/1000;
  say('ゴール! '+rec.km.toFixed(2)+' km / '+clock(sec)
      + (rec.km > 0.05 ? ' / 平均 '+clock(sec/rec.km)+'/km' : ''));
  rec = null;
  localStorage.removeItem(KEY);
  $('rec').textContent = 'スタート';
  $('rec').classList.remove('on');
}

$('rec').onclick = () => {
  if(rec){ speak('ゴール'); stopRec(); }
  else { speak('スタート'); startRec(); }
};

const saved = localStorage.getItem(KEY);
if(saved && location.hash !== '#test'){ startRec(JSON.parse(saved)); say('記録中だったので再開しました'); }

// #test で自己チェック
if(location.hash === '#test'){
  const p = dest(35.681, 139.767, 42, 3);
  console.assert(Math.abs(dist([35.681,139.767], p) - 3) < 0.001, 'dest/dist 不一致');
  start = L.latLng(35.681, 139.767);
  const w = waypoints('loop', 5, 1, {dir:0, spin:1, n:5});
  const peri = w.slice(1).reduce((s,p,i)=> s + dist(w[i], p), 0);
  console.assert(w.length === 6 && peri > 4 && peri < 5.2, 'ループ周長がおかしい: '+peri);
  console.assert(waypoints('back', 5, 1, {dir:0}).length === 3, '往復の経由点数');
  console.assert(waypoints('loop', 5, 1, {dir:0, spin:1, n:3}).length === 4, '大まかモードの経由点数');
  console.assert(silentWav(1).startsWith('data:audio/wav;base64,UklGR'), '無音WAVの生成');
  rec = {pts:[], km:0, t0:Date.now()};
  trackLine = {setLatLngs(){}};
  addPoint(L.latLng(35.681, 139.767), 10);
  addPoint(L.latLng(35.681, 139.767), 10);   // 同地点 -> 間引き
  addPoint(L.latLng(35.690, 139.767), 99);   // 精度99m -> 破棄
  addPoint(L.latLng(35.690, 139.767), 10);   // 約1km先
  console.assert(rec.pts.length === 2, '点の間引きがおかしい: '+rec.pts.length);
  console.assert(Math.abs(rec.km - 1.0) < 0.02, '距離集計がおかしい: '+rec.km);
  rec = null; localStorage.removeItem(KEY);
  voice = false;
  buildNav({legs:[{steps:[
    {maneuver:{type:'depart', modifier:'straight', location:[139.767, 35.681]}},
    {maneuver:{type:'new name', modifier:'straight', location:[139.767, 35.685]}},
    {maneuver:{type:'turn', modifier:'slight right', location:[139.767, 35.690]}},
    {maneuver:{type:'arrive', location:[139.767, 35.700]}}]}]});
  console.assert(nav.steps.length === 2, '出発と道なりを除外できていない: '+nav.steps.length);
  buildNav({legs:[
    {steps:[{maneuver:{type:'turn', modifier:'left', location:[139.767, 35.685]}},
            {maneuver:{type:'arrive', location:[139.767, 35.690]}}]},
    {steps:[{maneuver:{type:'depart', modifier:'straight', location:[139.767, 35.690]}},
            {maneuver:{type:'arrive', location:[139.767, 35.700]}}]}]});
  console.assert(nav.steps.length === 2, '経由点の到着を除外できていない: '+nav.steps.length);
  console.assert(nav.steps.map(x=>x.text).join() === '左です,ゴールです', 'ゴールが途中で鳴る: '+nav.steps.map(x=>x.text));
  console.assert(nav.steps[0].text === '右です', '曲がる向き: '+nav.steps[0].text);
  navCheck(L.latLng(35.6893, 139.767));            // 約78m手前 -> 事前予告のみ
  console.assert(nav.i === 0 && nav.pre, '事前予告が出ていない');
  navCheck(L.latLng(35.6899, 139.767));            // 約11m -> 通過して次へ
  console.assert(nav.i === 1 && !nav.pre, '手順が進まない: '+nav.i);
  nav = null; voice = true;
  say('self-test 完了(コンソール確認)');
}
</script>
</body>
</html>
